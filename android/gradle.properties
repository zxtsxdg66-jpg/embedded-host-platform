org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# 本项目路径包含中文（D:\毕业设计\android），Android Gradle Plugin 默认会因此直接
# 拒绝构建并提示 "Your project path contains non-ASCII characters"。
# 这一行是 AGP 官方提供的绕过开关（错误信息里直接给出的）。
#
# 实测结论（2026-08-15，本机 Windows + JDK17 + AGP 8.5.2 + Gradle 8.7）：
#   ✅ assembleDebug（编译打包 APK）：在中文路径下加上本开关后可以正常成功
#   ❌ testDebugUnitTest（JVM 单元测试）：在中文路径下仍然失败，报
#      ClassNotFoundException（Kotlin 已编译成功，但测试 worker 加载不到该类，
#      是中文路径在测试 worker classpath 上的编码问题，本开关管不到）
#
# 因此：跑 Android 单元测试时，请把本工程复制到纯英文路径下再跑，例如
#   robocopy D:\毕业设计\android D:\envmonitor-ascii-build /E /XD build .gradle
#   cd D:\envmonitor-ascii-build && gradle testDebugUnitTest
# 日常开发/打包 APK 不受影响，可以继续留在当前中文路径下。
android.overridePathCheck=true
