[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embedded-host-platform"
version = "0.1.0"
description = "Generic PC/Android host-computer platform for embedded device communication, debugging, monitoring, and data visualization."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyQt6>=6.6",
    "pyserial>=3.5",
    # gateway/（PC 内置网关：REST + WebSocket，供 Android 客户端调用）所需。
    # uvicorn[standard] 会带上 websockets，WebSocket 端点依赖它。
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyserial>=3.5",
    # fastapi.testclient 依赖 httpx（tests/gateway/ 用它跑真实 ASGI 请求与 WebSocket）
    "httpx>=0.27",
]
# 文档工具链（插图渲染、docx 生成）所需，src/ 与 tests/ 都用不到，故单列一组。
# 2026-09-12 补：这两个包此前一直是隐式依赖——本机装着就能跑，换台机器
# 或重建虚拟环境后文档工具会直接 ImportError。
docs = [
    "Pillow>=10.0",      # 渲染插图 PNG
    "python-docx>=1.1",  # 生成 docx
]
# 归档上云（scripts/cloud_sync.py）所需，单列一组的理由与 docs 相同：
# src/ 与 tests/ 都能在没有它的情况下跑通——上传器惰性连接，缺了它只是
# "导出照做、不上传"。2026-09-17 随 P3 声明；包本身此前已获用户授权安装。
cloud = [
    "oss2>=2.19",        # 阿里云对象存储 SDK
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
dummy-variable-rgx = "^_$"

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
explicit_package_bases = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

# oss2（阿里云 OSS SDK）既没有类型存根也没有 py.typed 标记，mypy 会报
# import-untyped。写成 override 而不是在 import 处加内联 ignore：override
# 就在依赖声明旁边，换包或升级时一眼看得见；内联 ignore 则散在代码里，
# 等哪天 oss2 自带了存根，也没人会想起来去删。2026-09-17 随 P3 上传器加入。
[[tool.mypy.overrides]]
module = ["oss2", "oss2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -q"
